name: runners-probe

# Throwaway diagnostic: which GitHub-hosted macOS images can this
# repository provision, and which Xcode versions do they carry?
# Results are reported as check-run annotations because job logs
# require admin rights on the repo.
on:
  push:
    branches: [ci-probe]
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Report
        run: |
          arch=$(uname -m)
          ver=$(sw_vers -productVersion 2>/dev/null || echo '?')
          xcs=$(ls -d /Applications/Xcode*.app 2>/dev/null | sed 's#/Applications/##' | tr '\n' ',' )
          def=$(xcodebuild -version 2>/dev/null | head -1 || echo none)
          iig=$(xcrun --find iig 2>/dev/null || echo none)
          echo "arch=$arch macos=$ver xcodes=[$xcs] default=[$def] iig=[$iig]"
          echo "::warning title=probe-${{ matrix.os }}::arch=$arch macos=$ver xcodes=[$xcs] default=[$def] iig=[$iig]"
