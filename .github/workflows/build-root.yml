name: build-root

# Builds the 16 GiB HFS+ iOS root image on a GitHub runner.
#
# This is possible only because a probe (probe-rootenv.yml) verified all six
# requirements on ubuntu-24.04:
#   disk 86 GB free | modprobe hfsplus OK | mkfs.hfsplus OK | mount OK |
#   fsck OK | apfs-fuse builds from source (cmake/ninja rc=0)
# That is why the user does not need to find a Linux machine.
#
# Output: ios16-root.simg (sparse, ~12 GB) plus an .xz of the same file, both
# uploaded as ONE artifact. There is no splitting.
#
# The old header claimed a 10 GB per-file artifact cap forced the split. That
# compared the cap against the UNCOMPRESSED size: the artifact actually shipped
# at 5.84 GB, and GitHub zips artifacts itself. Splitting only added a manual
# 'cat part*' step that can silently produce a right-sized, wrong-content file.
on:
  # workflow_dispatch needs the file on the DEFAULT branch; this workflow
  # lives on ugg-port, so a push trigger is what actually starts it.
  push:
    branches: [ugg-port, main]
    paths:
      - '.github/workflows/build-root.yml'
      - '.github/build-root-trigger'
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'Direct IPSW URL (leave empty to resolve via the ipsw tool)'
        required: false
        default: ''
      device:
        description: 'iPhone model identifier (ugg presents as iPhone 8)'
        default: 'iPhone10,4'
      version:
        description: 'iOS version'
        default: '16.7.16'


# A root image build is expensive: IPSW download, apfs-fuse build, a 16 GiB
# filesystem, several GiB of artifacts. Without a concurrency group, a push and a
# manual dispatch seconds apart start two full builds of the same commit, which is
# what happened and had to be cancelled by hand.
#
# cancel-in-progress is false on purpose: killing a build half way through leaves
# partial artifacts and wastes everything already spent. Queue instead.
concurrency:
  group: build-root-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk
        # The runner has 86 GB free; the job needs ~40. Remove the big
        # preinstalled toolchains anyway so a 16 GB image plus the IPSW plus
        # the sparse copy never runs the volume out.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync hfsprogs android-sdk-libsparse-utils \
            llvm cmake ninja-build libfuse3-dev zlib1g-dev libbz2-dev libssl-dev \
            git unzip python3 curl
          # hfsplus is a module on ubuntu-24.04 and modprobe works on the runner
          sudo modprobe hfsplus
          grep -i hfsplus /proc/modules || echo 'hfsplus not listed in /proc/modules'
          sudo mkdir -p /mnt/probe
          dd if=/dev/zero of=/tmp/p.img bs=1M count=32 status=none
          sudo mkfs.hfsplus -v PROBE /tmp/p.img >/dev/null
          sudo mount -t hfsplus -o loop,force /tmp/p.img /mnt/probe
          sudo touch /mnt/probe/x && echo 'HFS+ read-write OK' || echo 'HFS+ WRITE FAILED'
          sudo umount /mnt/probe

      - name: Build apfs-fuse
        run: |
          git clone -q --depth 1 https://github.com/sgan81/apfs-fuse.git /tmp/apfs-fuse
          cd /tmp/apfs-fuse
          git submodule update --init --depth 1
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release > /tmp/cmake.log 2>&1
          cmake --build build > /tmp/ninja.log 2>&1
          sudo cmake --install build
          sudo ldconfig
          command -v apfs-fuse && apfs-fuse --help 2>&1 | head -3 || true

      - name: Fetch the IPSW
        # The URL comes from api.ipsw.me, which lists the exact Apple CDN link
        # for a device and version. `ipsw download ipsw --url-only` does not
        # exist (checked the released binary), so do not use that.
        env:
          # Fallbacks are required: a push trigger supplies no inputs, and an
          # empty DEVID makes the API call /device/?type=ipsw, which is a 404.
          IPFW_URL: ${{ inputs.ipsw_url || '' }}
          DEVID: ${{ inputs.device || 'iPhone10,4' }}
          IOSVER: ${{ inputs.version || '16.7.16' }}
        run: |
          mkdir -p work/ipsw
          URL="$IPFW_URL"
          if [ -z "$URL" ]; then
            URL=$(python3 tools/ipsw_url.py "$DEVID" "$IOSVER")
          fi
          echo "IPSW URL: $URL"
          [ -n "$URL" ] || { echo '::error title=ipsw::cannot resolve a URL'; exit 1; }
          curl -L --retry 3 --retry-delay 5 -o work/ipsw/fw.ipsw "$URL"
          ls -l work/ipsw/fw.ipsw
          python3 tools/check_ipsw.py work/ipsw/fw.ipsw

      - name: Extract the three system images
        run: |
          unzip -q -o work/ipsw/fw.ipsw -d work/ipswext
          python3 tools/ipsw_roles.py work/ipswext "${{ inputs.device || 'iPhone10,4' }}"
          for role in OS SYSTEMOS APPOS; do
            f="work/ipswext/$(cat work/ipswext/$role.path)"
            ln -sf "$(realpath "$f")" "work/ipswext/$role.dmg"
            ls -l "work/ipswext/$role.dmg"
          done

      - name: Extract the device tree for /product (optional)
        # /product is what MobileGestalt reads at runtime; without it the
        # userland still boots but backboardd and friends misbehave (mido hit
        # this with a missing D211AP tree).
        #
        # This step must never block the root image: if the tree cannot be
        # extracted, the root is still worth building and the ADT simply ends up
        # without a /product node.
        continue-on-error: true
        run: |
          set +e
          sudo apt-get install -y -qq lzfse || true
          python3 tools/ipsw_adt.py work/ipsw/fw.ipsw "${{ inputs.device || 'iPhone10,4' }}" work/d20ap.adt
          rc=$?
          echo "ipsw_adt exit: $rc"
          if [ $rc -ne 0 ] || [ ! -s work/d20ap.adt ]; then
            echo '::warning title=device-tree::no device tree, the ADT will have no /product node'
            rm -f work/d20ap.adt
            exit 0
          fi
          python3 tools/ipsw_adt.py --check work/d20ap.adt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-device-tree
          path: work/d20ap.adt
          if-no-files-found: warn
          retention-days: 30
      - name: Build the HFS+ root
        # mkiosroot.sh does the apfs-fuse mounts, the rsync merge and applies
        # nothing else; sweet-root-tweaks.py then does the bring-up changes.
        run: |
          # mkiosroot.sh calls sudo itself for every mount/rsync, so do NOT
          # wrap it: a nested sudo has no tty on the runner and hangs.
          ./tools/mkiosroot.sh \
            work/ipswext/OS.dmg work/ipswext/SYSTEMOS.dmg work/ipswext/APPOS.dmg \
            work/ios16-root.img 16G
          sudo fsck.hfsplus -fy work/ios16-root.img


      - name: Apply the bring-up tweaks
        run: |
          sudo mkdir -p work/mnt
          sudo mount -t hfsplus -o loop,force work/ios16-root.img work/mnt
          sudo python3 ./tools/sweet-root-tweaks.py work/mnt
          # Check the boot-critical files WHILE THE VOLUME IS STILL MOUNTED.
          # After umount, work/mnt is an empty directory and every file would look
          # missing -- a guaranteed false failure that reads like the real bug.
          sync
          # Save the output to a file as well as to the log. The GitHub job-log API
          # has been returning 100 bytes for this repository, so a check whose answer
          # only reaches the log cannot be read back afterwards -- it would run and
          # its result would be lost. boot-files.txt ships as an artifact.
          #
          # The exit status is preserved with 'set -o pipefail' rather than
          # PIPESTATUS: the latter is bash-specific and a stray quote in it has
          # already broken this file once.
          set -o pipefail
          # Two outputs on purpose. check-boot-files.sh is the quick gate;
          # image-manifest.sh is the audit trail -- it also records sizes, modes,
          # owners and Mach-O magic, so the answer can be re-read later without
          # the 5.8 GB of parts.
          sh ./tools/check-boot-files.sh work/mnt 2>&1 | tee boot-files.txt
          sh ./tools/image-manifest.sh work/mnt work/image-manifest.txt 2>&1 | tee -a boot-files.txt
          # Resolve the two paths the kernel actually tries to exec. This walks the
          # catalog the same way the kernel does, so it answers 'is the file there
          # and is it a Mach-O' rather than 'a file with that name exists somewhere'.
          # A missing path here means errno 5 on the phone is NOT only about the
          # catalog, which would change what to fix.
          for p in /sbin/launchd /usr/lib/dyld; do
            echo "--- catalog lookup: $p"
            python3 ./tools/hfs-find.py work/ios16-root.img "$p" >> boot-files.txt 2>&1 \
              || echo "::warning title=catalog-lookup::could not resolve $p"
          done
          # Where the dyld shared cache actually lives. The manifest only sees the
          # final tree; this records the candidates too, because a 384 KiB stub with
          # the wrong magic is what the image currently ships and the two locations
          # look equally plausible from the outside.
          {
            echo "--- dyld shared cache candidates"
            for d in \
              System/Library/Caches/com.apple.dyld \
              System/Library/dyld \
              private/preboot/Cryptexes/OS/System/Library/dyld \
              private/preboot/Cryptexes/OS/System/Library/Caches/com.apple.dyld; do
              if [ -d "work/mnt/$d" ]; then
                n=$(ls -1 "work/mnt/$d" 2>/dev/null | wc -l)
                m=$(du -sm "work/mnt/$d" 2>/dev/null | cut -f1)
                echo "  $d: ${n} entry(ies), ${m} MiB"
                for f in "work/mnt/$d"/*; do
                  [ -f "$f" ] || continue
                  sz=$(wc -c < "$f")
                  mg=$(dd if="$f" bs=1 count=16 2>/dev/null | od -An -tc | tr -d " \n")
                  echo "    $(basename "$f") ${sz} bytes magic ${mg}"
                done
              else
                echo "  $d: absent"
              fi
            done
          } >> boot-files.txt 2>&1

          # Independent assertion from the artifact side: mkiosroot already
          # exits on a stub cache, but the manifest is what a human reads later,
          # so fail here too if the shipped cache is not a real one.
          if grep -q 'dyld shared cache: .*magic' boot-files.txt; then
            echo '--- shipped cache summary ---'
            grep 'dyld shared cache:' boot-files.txt | tail -2
          fi
          sudo umount work/mnt
          sudo fsck.hfsplus -fy work/ios16-root.img

      - name: Validate the volume before shipping it
        # Until now this workflow hashed the image and uploaded it without ever
        # checking that the filesystem on it is usable. A hash proves the bytes did
        # not change in transit; it says nothing about whether they form a valid
        # volume. The ugg port has spent many rounds chasing an HFS corruption that
        # was only ever seen on the phone, so the cheapest possible guard is to run
        # the same B-tree check here, on the image as built.
        #
        # fsck above already checks structure, but our checker is what the kernel
        # effectively does (descriptor links vs totalNodes), and it reads the sparse
        # file in place, so this also proves the sparse encoding round-trips.
        run: |
          # Key on the tool's exit status, not a grep of its output: the healthy
          # report contains the line 'BAD NODES    : 0', so grepping for 'bad'
          # fails every good build. Exit status is 0 sane, 1 problems, 2 usage.
          # Write the log with tee but take the status from the checker itself, so
          # no shell pipeline details are involved.
          if python3 ./tools/check-hfs-root.py --all work/ios16-root.img > hfs-check.txt 2>&1; then
            tail -20 hfs-check.txt
            echo "::notice title=hfs-check::every b-tree node looked sane"
          else
            rc=$?
            tail -40 hfs-check.txt
            echo "::error title=hfs-check::b-tree check failed (exit $rc) -- see hfs-check.txt"
            exit 1
          fi

      - name: Convert to sparse and ship it whole
        # No splitting.
        #
        # The old comment said artifacts are capped at 10 GB 'per file' and the
        # sparse image is ~12 GB, so it had to be split. That used the size
        # BEFORE GitHub zips the artifact: the shipped parts total 5.84 GB, and
        # a single file of that size is well inside the cap. The cap was never
        # the constraint, and splitting cost the user a manual 'cat part*' step
        # that could silently produce a right-sized, wrong-content file.
        run: |
          img2simg work/ios16-root.img work/ios16-root.simg
          ls -l work/ios16-root.img work/ios16-root.simg

          ( cd work && sha256sum ios16-root.simg > ASSEMBLED-SHA256.txt )
          stat -c "%n %s bytes" work/ios16-root.simg
          cat work/ASSEMBLED-SHA256.txt

          # A second, smaller download option. -6 is xz's own default: good
          # compression without the time cost of -9e, which matters because
          # this runs inside a 350 minute job and a 12 GB file is the biggest
          # thing in it. -T0 uses every core.
          echo "--- xz ---"
          time xz -6 -T0 -k work/ios16-root.simg
          ls -l work/ios16-root.simg.xz
          ( cd work && sha256sum ios16-root.simg.xz >> ASSEMBLED-SHA256.txt )
          cat work/ASSEMBLED-SHA256.txt

          # Round-trip the xz here rather than trusting it: if the archive cannot
          # be expanded back to the exact bytes, better to fail this build than
          # to have the user discover it after a 4 GB download.
          xz -t work/ios16-root.simg.xz && echo 'xz test: OK'

          # The image that ships is the sparse one, so check THAT too: img2simg
          # could in principle produce a valid-looking sparse file whose expansion
          # differs. This is the last point at which that can be caught without a
          # phone.
          echo "--- re-check through the sparse encoding ---"
          if python3 ./tools/check-hfs-root.py --all work/ios16-root.simg > hfs-check-sparse.txt 2>&1; then
            tail -5 hfs-check-sparse.txt
            echo "::notice title=hfs-check-sparse::sparse image passes too"
          else
            rc=$?
            tail -40 hfs-check-sparse.txt
            echo "::error title=hfs-check-sparse::the SPARSE image fails the b-tree check (exit $rc)"
            exit 1
          fi

      - name: Report
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, json
          def ann(kind, title, body):
              esc = body.replace('%', '%25').replace(chr(13), '').replace(chr(10), '%0A')
              print('::%s title=%s::%s' % (kind, title, esc[:40000]))
          img = 'work/ios16-root.img'
          simg = 'work/ios16-root.simg'
          lines = []
          for p in (img, simg):
              lines.append('%s %d' % (p, os.path.getsize(p)) if os.path.exists(p) else '%s MISSING' % p)
          for extra in ('work/ios16-root.simg.xz', 'work/ASSEMBLED-SHA256.txt'):
              lines.append('%s %d' % (extra, os.path.getsize(extra)) if os.path.exists(extra) else '%s MISSING' % extra)
          ann('notice', 'root-sizes', chr(10).join(lines))
          PY

      - name: Write the unpack instructions
        run: |
          {
            printf '%s\n' 'Two downloads are in this artifact. Take whichever you prefer:' ''
            printf '%s\n' '  ios16-root.simg      the image, ready to flash'
            printf '%s\n' '  ios16-root.simg.xz   the same image, compressed (smaller download)' ''
            printf '%s\n' 'If you took the .xz, expand it first:' ''
            printf '%s\n' '    Linux/macOS :  xz -d ios16-root.simg.xz'
            printf '%s\n' '    Windows     :  tar -xf ios16-root.simg.xz        (Windows 10 1803+)'
            printf '%s\n' '                   or install 7-Zip and open the .xz' ''
            printf '%s\n' 'Then verify it (optional but cheap):' ''
            printf '%s\n' '    Windows PowerShell :  ./check-sha256.ps1 ios16-root.simg -Sums ASSEMBLED-SHA256.txt'
            printf '%s\n' '    Linux/macOS        :  sha256sum -c ASSEMBLED-SHA256.txt' ''
            printf '%s\n' 'Then flash, and boot the no-touch image:' ''
            printf '%s\n' '    fastboot flash userdata ios16-root.simg'
            printf '%s\n' '    fastboot boot shim-boot-0107-notouch.img'
          } > UNPACK.txt
          cat UNPACK.txt

      # TWO artifacts on purpose, because a GitHub artifact is an atomic zip.
      #
      # The first version of this step put both files in one artifact, so the
      # user could 'pick the smaller one' -- except downloading an artifact
      # fetches everything in it, 9.66 GiB, which is more than the .xz alone.
      # Splitting means the small download is actually small.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios16-root-xz
          # ~5 GB instead of ~12 GB. This is the one to download.
          # .xz is already compressed, so zipping it again gains nothing;
          # level 0 stops the runner spending minutes to prove that.
          compression-level: 0
          path: |
            work/ios16-root.simg.xz
            work/ASSEMBLED-SHA256.txt
            UNPACK.txt
            # Ship the verifier with the thing it verifies. UNPACK.txt told the
            # user to run ./check-sha256.ps1, but the file was never included,
            # so the instruction pointed at nothing on their machine.
            tools/check-sha256.ps1
          retention-days: 5
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios16-root-raw
          # The uncompressed image, for anyone who cannot expand .xz. Only
          # fetched when explicitly chosen.
          path: work/ios16-root.simg
          retention-days: 5
          if-no-files-found: warn

      # The validation logs are the evidence that the image was checked, and they
      # are small. Without this the run says 'Validate ... success' and nothing
      # else, which cannot be audited later -- and an assertion nobody can re-read
      # is hard to distinguish from one that never ran.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-check
          # Renamed from hfs-check: it now answers more than the b-tree question.
          path: |
            boot-files.txt
            work/image-manifest.txt
            hfs-check.txt
            hfs-check-sparse.txt
          retention-days: 30
          if-no-files-found: warn
