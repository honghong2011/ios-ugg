name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: UGG
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main, ugg-port]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'UGG' }}

jobs:
  build:
    # macos-14 (which ships Xcode 15.x, whose iig matches the xnu-8796 IORPC
    # ABI) is not provisionable for this account: the label resolves to the
    # arm64 image 'macos-14-arm64-us-default' and the job is cancelled before
    # any step runs. macos-13 is retired (queues forever), and the plain
    # macos-15 label is arm64 too. So: macos-15-intel, whose only Xcodes are
    # 16.x/26.x -- iig 16's IORPC ABI is handled by the patch chain.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled);
          # there is no bottle for it on the current images
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee ../build.log

      - name: Surface failures as check annotations
        # Job logs on this repository require admin rights, but check
        # annotations are world-readable, so push the diagnosis through them:
        # that is what makes the build iterable without a token.
        if: always()
        run: |
          python3 - <<'PY'
          import os, re, hashlib
          try:
              log = open('build.log', errors='replace').read()
          except OSError as exc:
              print(f"::warning title=no-build-log::{exc}")
              raise SystemExit(0)

          def ann(kind, title, body):
              esc = (body.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
              print(f"::{kind} title={title}::{esc[:60000]}")

          applied = re.findall(r'Applying patch: (\S+)', log)
          skipped = re.findall(r'Skipping patch (\S+)[^\n]*', log)
          ann('notice', 'patch-report', f"applied={len(applied)} skipped={len(skipped)}")

          # darwin-xnu-build ships patches for every macOS release and applies
          # them all; the ones that do not fit 13.5 are expected to be skipped.
          # Only our own numbered chain (0NNN-*.patch) skipping is a failure.
          ours_skipped = [s for s in skipped if re.search(r'/\d{4}-', s)]
          other_skipped = [s for s in skipped if s not in ours_skipped]
          if ours_skipped:
              ann('error', 'patches-skipped', '\n'.join(ours_skipped[:25]))
          if other_skipped:
              ann('notice', 'patches-skipped-foreign', '\n'.join(other_skipped[:25]))

          pat = re.compile(r'error:|fatal error:|undefined symbol|Undefined symbols for '
                           r'architecture|No such file or directory|\*\*\* \[|Undefined:')
          errs = [l for l in log.splitlines() if pat.search(l)]
          ann('error', 'build-errors', '\n'.join(errs[:80]) if errs else 'none matched')
          PY



      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - name: Report artifact inventory as annotations
        # Runs after Collect, and exists because the artifacts themselves need
        # a GitHub login to download: this is the only anonymous proof of what
        # was built, and of whether MACHINE_CONFIG=UGG drove it.
        if: always()
        run: |
          python3 - <<'PY'
          import os, re, hashlib

          def ann(kind, title, body):
              esc = (body.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
              print(f"::{kind} title={title}::{esc[:60000]}")

          try:
              names = sorted(os.listdir('out'))
          except OSError as exc:
              ann('warning', 'artifact-scan', str(exc))
              raise SystemExit(0)

          lines = [f"{n} {os.path.getsize(os.path.join('out', n))}"
                   for n in names if os.path.isfile(os.path.join('out', n))]
          ann('notice', 'artifact-files', '\n'.join(lines) or '(out/ is empty)')

          kernel = next((os.path.join('out', n) for n in names
                         if n.startswith('kernel.') and not n.endswith('.unstripped')), None)
          if not kernel:
              ann('error', 'kernel-missing', 'no kernel.* in out/')
              raise SystemExit(0)

          h = hashlib.sha256()
          with open(kernel, 'rb') as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b''):
                  h.update(chunk)
          ann('notice', 'kernel-sha256',
              f"{os.path.basename(kernel)} {os.path.getsize(kernel)} {h.hexdigest()}")

          with open(kernel, 'rb') as fh:
              blob = fh.read()
          # The object path encodes the machine config, so this says whether
          # -DARM64_BOARD_CONFIG_UGG actually drove the build.
          seen = sorted(set(re.findall(rb'ARM64_[A-Z0-9_]+', blob)))
          ann('notice', 'kernel-machine-configs', ' '.join(s.decode() for s in seen[:20]))
          marks = [s.decode() for s in
                   (b'sweet_gic_ack', b'sweet_gic_eoi', b'sweet_gic_send_sgi',
                    b'sweet_early_mark', b'sweet_early_panic', b'ARM64_BOARD_CONFIG_UGG')
                   if s in blob]
          ann('notice', 'kernel-ugg-symbols', ' '.join(marks) or '(none found)')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
