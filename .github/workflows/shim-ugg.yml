name: shim-ugg

on:
  push:
    branches: [ugg-port]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu cpio

      - name: Build shim + boot image
        run: ./shim/build.sh

      - name: Check boot image layout
        run: |
          python3 - <<'PY'
          import struct
          d = open('shim/out/shim-boot.img', 'rb').read()
          assert d[:8] == b'ANDROID!', 'boot magic'
          ks, ka, rs, ra, ss, sa, ta, ps = struct.unpack_from('<8I', d, 8)
          hv = struct.unpack_from('<I', d, 40)[0]
          assert hv == 0 and ps == 2048, 'header v0 / 2048-byte pages'
          assert (ka, ra, ta) == (0x80008000, 0x81000000, 0x80000100), hex((ka, ra, ta))
          kend = ps + (ks + ps - 1) // ps * ps
          assert d[kend:kend + 2] == b'\x1f\x8b', 'ramdisk gzip magic'
          assert len(d) == kend + (rs + ps - 1) // ps * ps, 'image length'
          print('boot image OK: kernel %#x ramdisk %#x page %d' % (ks, rs, ps))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: shim-ugg
          path: |
            shim/out/Image
            shim/out/ramdisk.bin
            shim/out/shim-boot.img
