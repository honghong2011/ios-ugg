name: shim-ugg

# Builds the ugg boot shim (BOARD_UGG) to shim/out/Image. Needs a cross
# compiler, so it runs here; the final boot image (payload appended, gzip, DTB
# bundle) is assembled locally by tools/, where the device DTB bundle lives
# (device dumps are never committed).
on:
  push:
    branches: [ugg-port]
    paths:
      - 'shim/**'
      - '.github/workflows/shim-ugg.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu cpio

      - name: Build shim
        run: |
          set -o pipefail
          ./shim/build.sh 2>&1 | tee build.log

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Check shim Image
        run: |
          python3 - <<'PY'
          import struct
          d = open('shim/out/Image', 'rb').read()
          assert d[56:60] == b'ARM\x64', 'arm64 Image magic missing'
          isz = struct.unpack_from('<Q', d, 8)[0]
          assert 0 < isz <= len(d), 'image_size %#x vs file %#x' % (isz, len(d))
          print('shim Image OK: %d bytes, image_size 0x%x' % (len(d), isz))
          PY

      - name: Report shim as annotation
        if: always()
        run: |
          python3 - <<'PY'
          import os, hashlib
          p = 'shim/out/Image'
          if os.path.exists(p):
              d = open(p, 'rb').read()
              print('::notice title=shim-image::%d bytes sha256=%s'
                    % (len(d), hashlib.sha256(d).hexdigest()))
          else:
              print('::error title=shim-missing::no shim/out/Image')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: shim-ugg
          path: shim/out/Image
